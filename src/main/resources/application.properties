spring.application.name=biblioteca-universitaria

# --- MySQL (variables de entorno con valores por defecto para desarrollo) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biblioteca?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- Pool de conexiones (ver analisis de concurrencia: 20-30 es suficiente para ~100 solicitudes) ---
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:25}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# --- JPA / Hibernate: el esquema lo gobierna schema.sql ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Inicializacion con schema.sql y data.sql (idempotentes) ---
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# --- JWT ---
# SOLO PARA DESARROLLO: en cualquier otro entorno define JWT_SECRET (Base64, minimo 32 bytes)
app.jwt.secret=${JWT_SECRET:AHq5NpMEvqT3Jtm+gRuS+PcEJ+jbKAmc4jjtXdjbaFHDsfaMzqqaCnddKyUdblZP}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
